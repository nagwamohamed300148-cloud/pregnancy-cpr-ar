<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pregnancy CPR | Skill 01 AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:var(--screen-h,100dvh);overflow:hidden;background:transparent;color:#fff;font:14px Arial,sans-serif}
.panel{position:fixed;z-index:20;left:10px;right:10px;background:rgba(5,24,44,.87);border:1px solid #39c9e9;border-radius:12px;padding:10px;box-shadow:0 3px 12px #0005;overflow-wrap:anywhere}
header{z-index:2147483646!important;top:calc(6px + env(safe-area-inset-top));max-height:18dvh;overflow:auto}
header strong{display:block;overflow-wrap:anywhere;white-space:normal;font-size:clamp(12px,3.3vw,16px);line-height:1.3}
header small{display:block;margin-top:4px;color:#b5eafa;font-size:12px}
#status{font-size:11px;color:#9fe5f5;margin-top:5px}
.bottom{position:fixed!important;bottom:calc(12px + env(safe-area-inset-bottom))!important;top:auto!important;max-height:40dvh;overflow:auto;z-index:2147483647!important;transform:translateZ(0);isolation:isolate;pointer-events:auto!important}
#step{font-weight:bold;font-size:14px;margin-bottom:5px}
#detail{font-size:12px;line-height:1.45;color:#d5e9f3;max-height:22vh;overflow:auto} .kicker{font-weight:700;color:#74e1fa;margin:6px 0 2px}.progress{height:4px;background:#26485b;border-radius:8px;margin-bottom:8px}.progress span{display:block;height:100%;background:#30d5e8;border-radius:8px;transition:width .2s} .buttons button{touch-action:manipulation} #notice{max-height:5vh;overflow:hidden}
.buttons{display:flex;gap:6px;margin-top:8px}
button{flex:1;min-width:0;padding:10px 2px;border:0;border-radius:8px;background:#14b9dc;color:#041725;font-size:12px;font-weight:bold}
button:disabled{opacity:.4}button.secondary{background:#d6eaf2}
#notice{position:fixed;top:25%;left:15px;right:15px;text-align:center;color:#fff;text-shadow:0 2px 5px #000;z-index:15;pointer-events:none;font-size:12px}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:var(--screen-h,100dvh)!important;z-index:0!important;background:transparent!important}
a-scene canvas{background:transparent!important}
.bottom,.bottom *{visibility:visible!important}
.bottom button{position:relative;z-index:2;pointer-events:auto!important}
@media(max-height:650px){.bottom{padding:7px!important;max-height:42vh}.bottom #detail{max-height:14vh}.bottom button{padding:8px 2px}}
</style>
<script>
AFRAME.registerComponent('pulse-heart',{
 init:function(){this.baseScale=this.el.object3D.scale.clone()},
 tick:function(t){if(!this.baseScale)return;const s=1+.07*Math.sin(t/240);this.el.object3D.scale.copy(this.baseScale).multiplyScalar(s)}
});
</script>
</head>
<body>
<header class="panel"><strong>PREGNANCY CPR · AR CLINICAL TRAINING</strong><small>Skill 01 — Pre-Procedure Activities</small><div id="status">Loading AR…</div></header>
<div id="notice">Point camera at the exact Skill 01 image used to create targets.mind</div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true; antialias: true; alpha: true" background="color: #000000; transparent: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0">
<!-- Educational 3D schematic anchored to the existing Skill 01 image target. -->
<a-entity id="model" position="0 0 0.11" scale="0.48 0.48 0.48">
  <a-sphere position="0 -0.04 0" scale="0.43 0.67 0.19" material="color:#f1c6b5;transparent:true;opacity:0.20;side:double;depthWrite:false"></a-sphere>
  <a-sphere position="0 -0.37 0.02" scale="0.42 0.31 0.25" material="color:#f1c6b5;transparent:true;opacity:0.18;side:double;depthWrite:false"></a-sphere>
  <a-entity id="organs">
    <a-cylinder position="0 0.35 0.13" radius="0.025" height="0.18" color="#e4d8bd"></a-cylinder>
    <a-sphere position="-0.16 0.15 0.17" scale="0.15 0.25 0.10" material="color:#f4a4b9;roughness:0.65"></a-sphere>
    <a-sphere position="0.16 0.15 0.17" scale="0.15 0.25 0.10" material="color:#f4a4b9;roughness:0.65"></a-sphere>
    <a-sphere id="heart" pulse-heart position="0.025 0.13 0.29" scale="0.085 0.115 0.08" color="#dc3056"></a-sphere>
    <a-sphere position="0 -0.36 0.20" scale="0.30 0.24 0.17" material="color:#a54c75;roughness:0.55"></a-sphere>
    <a-sphere position="0.02 -0.38 0.35" scale="0.105 0.13 0.065" color="#f4c4a0"></a-sphere>
    <a-torus position="0 0.15 0.24" radius="0.32" radius-tubular="0.006" color="#9ce9ff" opacity="0.65"></a-torus>
  </a-entity>
  <a-text value="LUNGS" position="-0.34 0.43 0.32" width="0.85" color="#c8f2ff" align="center" side="double"></a-text>
  <a-text value="HEART" position="0.32 0.28 0.38" width="0.75" color="#ffe1e7" align="center" side="double"></a-text>
  <a-text value="UTERUS" position="-0.33 -0.54 0.33" width="0.85" color="#ffd4e9" align="center" side="double"></a-text>
  <a-text value="SCHEMATIC" position="0 -0.75 0.25" width="1.5" align="center" color="#ffffff" side="double"></a-text>
</a-entity>
</a-entity>
</a-scene>
<div class="panel bottom"><div class="progress"><span id="progress"></span></div><div id="step"></div><div id="detail"></div><div class="buttons"><button id="prev" class="secondary">Previous</button><button id="next">Next</button><button id="anatomy" class="secondary">Hide anatomy</button></div></div>
<script>
const steps=[
 {title:'Ensure scene safety',action:'Survey the area for electrical, environmental, and equipment hazards before approaching.',why:'A safe scene protects the patient and the response team. This is a preparation step; internal anatomy is shown only as contextual orientation.',focus:'overview'},
 {title:'Wear PPE',action:'Apply appropriate personal protective equipment according to local infection-prevention policy.',why:'Barrier precautions reduce exposure risks. Use available PPE without unnecessarily delaying time-critical resuscitation.',focus:'overview'},
 {title:'Assess responsiveness',action:'Gently tap the shoulders and speak loudly: “Are you okay?” Check for a response.',why:'Unresponsiveness is a critical warning sign requiring rapid emergency assessment. The heart and lungs are highlighted as the organs at risk if circulation and breathing fail.',focus:'thorax'},
 {title:'Call for immediate help',action:'Activate the emergency response system and summon the resuscitation team and equipment.',why:'Early coordinated response is essential in maternal collapse. Pregnancy requires additional planning for maternal and fetal needs.',focus:'all'},
 {title:'Verify identity and readiness',action:'Confirm identity only when feasible without delaying care; check that maternal-resuscitation resources and personnel are being mobilized.',why:'Pregnancy changes anatomy and physiology, including potential compression of major vessels by the enlarged uterus. This diagram is illustrative, not patient-specific.',focus:'uterus'},
 {title:'Position yourself for CPR',action:'Move alongside the patient and prepare to perform the next indicated resuscitation actions on a firm surface.',why:'Correct positioning supports effective chest compressions. For a pregnant patient, trained team members should plan pregnancy-specific modifications as indicated by the clinical protocol.',focus:'thorax'}
];
let idx=0,visible=true,tracked=false;const $=id=>document.getElementById(id);
function render(){
 const st=steps[idx];
 $('step').textContent=`${idx+1}/6 — ${st.title}`;
 $('detail').innerHTML='';
 for(const [label,value] of [['STUDENT ACTION',st.action],['WHY IT MATTERS',st.why]]){
   const h=document.createElement('div');h.className='kicker';h.textContent=label;
   const t=document.createElement('div');t.textContent=value;
   $('detail').append(h,t);
 }
 $('progress').style.width=((idx+1)/6*100)+'%';
 $('prev').disabled=idx===0;$('next').disabled=idx===5;
 $('anatomy').textContent=visible?'Hide anatomy':'Show anatomy';
 const organs=$('organs'); if(organs)organs.setAttribute('visible',visible);
 const heart=$('heart'); if(heart)heart.setAttribute('color',st.focus==='thorax'?'#ff3864':'#dc3056');
}
$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};
$('next').onclick=()=>{idx=Math.min(5,idx+1);render()};
$('anatomy').onclick=()=>{visible=!visible;render()};render();
function syncViewport(){document.documentElement.style.setProperty('--screen-h',window.innerHeight+'px')}syncViewport();window.addEventListener('resize',syncViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncViewport);
const scene=document.querySelector('a-scene');
scene.addEventListener('loaded',()=>{$('status').textContent='3D scene loaded — starting camera…'});
scene.addEventListener('arReady',()=>{$('status').textContent='Camera ready — scan Skill 01 marker'});
scene.addEventListener('arError',()=>{$('status').textContent='AR ERROR — camera, network, or tracking issue'});
$('target').addEventListener('targetFound',()=>{tracked=true;$('notice').textContent='Marker detected — 3D schematic visible';$('status').textContent='Marker detected — anatomy schematic active';});
$('target').addEventListener('targetLost',()=>{tracked=false;$('notice').textContent='Point camera at Skill 01 marker';$('status').textContent='Marker not in view';});
window.addEventListener('error',e=>{$('status').textContent='PAGE ERROR: '+String(e.message).slice(0,90)});
</script>
</body></html>

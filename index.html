<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pregnancy CPR | Skill 01 · Visual Learning</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:var(--screen-h,100dvh);overflow:hidden;background:transparent;color:#fff;font:14px Arial,sans-serif}
.panel{position:fixed;z-index:20;left:10px;right:10px;background:rgba(5,24,44,.87);border:1px solid #39c9e9;border-radius:12px;padding:10px;box-shadow:0 3px 12px #0005;overflow-wrap:anywhere}
header{z-index:2147483646!important;top:calc(6px + env(safe-area-inset-top));max-height:18dvh;overflow:auto}
header strong{display:block;overflow-wrap:anywhere;white-space:normal;font-size:clamp(12px,3.3vw,16px);line-height:1.3}
header small{display:block;margin-top:4px;color:#b5eafa;font-size:12px}
#status{font-size:11px;color:#9fe5f5;margin-top:5px}
.bottom{position:fixed!important;bottom:calc(76px + env(safe-area-inset-bottom))!important;top:auto!important;max-height:min(38dvh,310px);overflow:auto;z-index:2147483647!important;transform:translateZ(0);isolation:isolate;pointer-events:auto!important}
#step{font-weight:bold;font-size:14px;margin-bottom:5px}
#detail{font-size:12px;line-height:1.45;color:#d5e9f3;max-height:15dvh;overflow:auto} .kicker{font-weight:700;color:#74e1fa;margin:6px 0 2px}.progress{height:4px;background:#26485b;border-radius:8px;margin-bottom:8px}.progress span{display:block;height:100%;background:#30d5e8;border-radius:8px;transition:width .2s} .buttons button{touch-action:manipulation} #notice{max-height:5vh;overflow:hidden}
.buttons{display:flex;gap:6px;margin-top:8px}
button{flex:1;min-width:0;padding:10px 2px;border:0;border-radius:8px;background:#14b9dc;color:#041725;font-size:12px;font-weight:bold}
button:disabled{opacity:.4}button.secondary{background:#d6eaf2}
#notice{position:fixed;top:25%;left:15px;right:15px;text-align:center;color:#fff;text-shadow:0 2px 5px #000;z-index:15;pointer-events:none;font-size:12px}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:var(--screen-h,100dvh)!important;z-index:0!important;background:transparent!important}
a-scene canvas{background:transparent!important}
.bottom,.bottom *{visibility:visible!important}
.bottom button{position:relative;z-index:2;pointer-events:auto!important}
@media(max-height:650px){.bottom{padding:7px!important;max-height:34vh}.bottom #detail{max-height:11vh}.bottom button{padding:8px 2px}}
/* Visual scene 6 includes a real GLB mannequin model. */
#asset-status{font-size:10px;color:#b6ecff;margin-top:3px}
/* AR visual HUD is informational; never intercept camera gestures. */
.visual-hud{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(100px + env(safe-area-inset-top));width:min(78vw,350px);pointer-events:none;text-align:center;background:rgba(5,24,44,.76);border:1px solid rgba(89,216,235,.7);border-radius:12px;padding:7px 9px;box-shadow:0 5px 18px #0006}
.visual-hud span{display:block;color:#8eeaff;font-size:10px;letter-spacing:2px}.visual-hud strong{display:block;font-size:12px;margin-top:3px}.visual-hud small{display:block;font-size:9px;color:#c2d9e4;margin-top:3px}
.bottom{display:flex;flex-direction:column;overflow:hidden!important;max-height:min(37dvh,290px)!important}
.bottom #detail{min-height:0;overflow-y:auto;max-height:none;flex:1;overscroll-behavior:contain}
.bottom .buttons{flex-shrink:0;background:rgba(5,24,44,.95);padding-top:6px}
.bottom .buttons button{min-height:42px}
/* Keep the control bar above mobile browser navigation, while retaining a scrollable description. */
@media(max-width:480px){.bottom{left:10px;right:10px;padding:9px;bottom:calc(80px + env(safe-area-inset-bottom))!important}.bottom button{min-height:42px;font-size:12px}header{max-height:16dvh}}
@media(max-height:560px){.bottom{bottom:calc(55px + env(safe-area-inset-bottom))!important;max-height:34dvh}.bottom #detail{max-height:9dvh}}
</style>
<script>
AFRAME.registerComponent('pulse-heart',{
 init:function(){this.baseScale=this.el.object3D.scale.clone()},
 tick:function(t){if(!this.baseScale)return;const s=1+.07*Math.sin(t/240);this.el.object3D.scale.copy(this.baseScale).multiplyScalar(s)}
});
</script>
</head>
<body>
<header class="panel"><strong>PREGNANCY CPR · AR CLINICAL TRAINING</strong><small>Skill 01 — Pre-Procedure Activities</small><div id="status">Loading AR…</div><div id="asset-status">Training mannequin: loading 3D asset…</div></header>
<div id="notice">Point camera at the exact Skill 01 image used to create targets.mind</div>

<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true; antialias: true; alpha: true" background="color: #000000; transparent: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0">
<!-- Educational 3D schematic anchored to the existing Skill 01 image target. -->
<a-entity id="model" position="0 0 0.11" scale="0.48 0.48 0.48">
<a-entity id="visuals">
<!-- Each visual is a separate animated educational scene; switching is controlled by render(). -->
<!-- Step 1: hazard scene -->
<a-entity id="visual-0" visible="true">
<a-plane position="0 -0.45 0" width="1.45" height=".55" color="#123b4b" opacity=".75"></a-plane>
<a-box position="-.40 -.23 .10" width=".22" height=".23" depth=".12" color="#edb54e" animation="property:rotation;to:0 0 6;dir:alternate;dur:900;loop:true"></a-box>
<a-text value="!" position="-.46 -.28 .20" width=".8" color="#152535"></a-text>
<a-torus position=".35 -.17 .15" radius=".16" radius-tubular=".018" color="#ff6e75" animation="property:scale;from:1 1 1;to:1.18 1.18 1;dir:alternate;dur:900;loop:true"></a-torus>
<a-text value="SAFETY CHECK" position="0 .30 .16" width="1.65" align="center" color="#ffffff"></a-text>
<a-text value="Scan for hazards" position="0 .12 .16" width="1.4" align="center" color="#9ef3ff"></a-text>
</a-entity>
<!-- Step 2: PPE -->
<a-entity id="visual-1" visible="false">
<a-sphere position="-.30 0 .12" scale=".20 .31 .10" color="#65cbe8"></a-sphere>
<a-sphere position=".30 0 .12" scale=".20 .31 .10" color="#65cbe8"></a-sphere>
<a-box position="0 .06 .22" width=".30" height=".19" depth=".06" color="#f1f8fc"></a-box>
<a-text value="GLOVES + MASK" position="0 .45 .12" width="1.65" align="center" color="#ffffff"></a-text>
<a-ring position="0 .06 .29" radius-inner=".26" radius-outer=".28" color="#51e6c5" animation="property:rotation;to:0 0 360;dur:5000;loop:true;easing:linear"></a-ring>
</a-entity>
<!-- Step 3: responsiveness -->
<a-entity id="visual-2" visible="false">
<a-sphere position="0 .12 .03" scale=".20 .24 .16" color="#e5b49e"></a-sphere>
<a-box position="0 -.26 .03" width=".64" height=".44" depth=".18" color="#7fabc0"></a-box>
<a-sphere position="-.34 -.09 .18" radius=".085" color="#ffdd78" animation="property:position;from:-.43 -.09 .18;to:-.29 -.09 .18;dir:alternate;dur:650;loop:true"></a-sphere>
<a-sphere position=".34 -.09 .18" radius=".085" color="#ffdd78" animation="property:position;from:.43 -.09 .18;to:.29 -.09 .18;dir:alternate;dur:650;loop:true"></a-sphere>
<a-text value="ARE YOU OKAY?" position="0 .51 .12" width="1.65" align="center" color="#ffffff"></a-text>
<a-text value="Tap shoulders + call" position="0 -.62 .12" width="1.55" align="center" color="#9ef3ff"></a-text>
</a-entity>
<!-- Step 4: help -->
<a-entity id="visual-3" visible="false">
<a-box position="0 0 .12" width=".48" height=".65" depth=".12" color="#2b667e"></a-box>
<a-box position="0 0 .20" width=".34" height=".40" depth=".02" color="#d9f4fa"></a-box>
<a-text value="SOS" position="0 0 .24" width="1.1" align="center" color="#bb283f"></a-text>
<a-torus position="0 0 .16" radius=".44" radius-tubular=".016" color="#ff646e" animation="property:scale;from:.8 .8 1;to:1.15 1.15 1;dir:alternate;dur:800;loop:true"></a-torus>
<a-text value="ACTIVATE RESPONSE" position="0 .53 .12" width="1.8" align="center" color="#ffffff"></a-text>
<a-text value="Call team + AED" position="0 -.53 .12" width="1.55" align="center" color="#9ef3ff"></a-text>
</a-entity>
<!-- Step 5: maternal anatomy schematic -->
<a-entity id="visual-4" visible="false">
<a-sphere position="0 -.05 0" scale=".40 .65 .23" material="color:#e5b69e;transparent:true;opacity:.24;side:double"></a-sphere>
<a-sphere position="-.15 .15 .18" scale=".14 .22 .09" color="#efa4b3"></a-sphere>
<a-sphere position=".15 .15 .18" scale=".14 .22 .09" color="#efa4b3"></a-sphere>
<a-sphere position="0 .13 .28" scale=".08 .10 .08" color="#d93e60" animation="property:scale;from:.08 .10 .08;to:.09 .11 .09;dir:alternate;dur:480;loop:true"></a-sphere>
<a-sphere position="0 -.30 .20" scale=".30 .26 .18" color="#a45786"></a-sphere>
<a-sphere position=".03 -.32 .36" scale=".11 .13 .08" color="#f0c19d"></a-sphere>
<a-text value="MATERNAL ANATOMY" position="0 .68 .12" width="1.9" align="center" color="#ffffff"></a-text>
<a-text value="Illustrative only" position="0 -.70 .12" width="1.4" align="center" color="#9ef3ff"></a-text>
</a-entity>
<!-- Step 6: rescuer position -->
<a-entity id="visual-5" visible="false">
<!-- Actual uploaded training mannequin GLB; fallback primitives remain if the asset is not loaded. -->
<a-entity id="training-mannequin" gltf-model="url(./training_mannequin.glb)" position="0 -0.02 0.12" rotation="0 0 0" scale="0.52 0.52 0.52" visible="false"></a-entity>
<a-entity id="mannequin-fallback">
<a-box position="0 -.12 0" width=".68" height=".72" depth=".17" color="#7fabc0"></a-box>
<a-sphere position="0 .38 0" radius=".17" color="#e7b9a3"></a-sphere>
<a-cylinder position="-.62 -.22 .15" radius=".10" height=".54" color="#64d4f2"></a-cylinder>
<a-sphere position="-.62 .13 .15" radius=".14" color="#64d4f2"></a-sphere>
<a-cone position="-.32 -.23 .18" radius-bottom=".10" radius-top="0" height=".25" rotation="0 0 -90" color="#ffe077" animation="property:position;from:-.42 -.23 .18;to:-.29 -.23 .18;dir:alternate;dur:950;loop:true"></a-cone>
<a-text value="POSITION BESIDE PATIENT" position="0 .69 .12" width="2.1" align="center" color="#ffffff"></a-text>
</a-entity>
</a-entity>
</a-entity>
</a-entity>
</a-entity>
</a-scene>
<div class="visual-hud" aria-live="polite"><span id="step-counter">SCENE 01 / 06</span><strong id="visual-caption">HAZARD RECOGNITION</strong><small>Interactive 3D learning · Illustrations are not clinical anatomy</small></div>
<div class="panel bottom"><div class="progress"><span id="progress"></span></div><div id="step"></div><div id="detail"></div><div class="buttons"><button id="prev" class="secondary">Previous</button><button id="next">Next</button><button id="anatomy" class="secondary">Hide 3D</button></div></div>
<script>
const steps=[
 {title:'Ensure scene safety',action:'Survey the area for electrical, environmental, and equipment hazards before approaching.',why:'A safe scene protects the patient and the response team. This is a preparation step; internal anatomy is shown only as contextual orientation.',visual:'HAZARD RECOGNITION'},
 {title:'Wear PPE',action:'Apply appropriate personal protective equipment according to local infection-prevention policy.',why:'Barrier precautions reduce exposure risks. Use available PPE without unnecessarily delaying time-critical resuscitation.',visual:'PERSONAL PROTECTION'},
 {title:'Assess responsiveness',action:'Gently tap the shoulders and speak loudly: “Are you okay?” Check for a response.',why:'Unresponsiveness is a critical warning sign requiring rapid emergency assessment. The heart and lungs are highlighted as the organs at risk if circulation and breathing fail.',visual:'RESPONSE ASSESSMENT'},
 {title:'Call for immediate help',action:'Activate the emergency response system and summon the resuscitation team and equipment.',why:'Early coordinated response is essential in maternal collapse. Pregnancy requires additional planning for maternal and fetal needs.',visual:'EMERGENCY ACTIVATION'},
 {title:'Verify identity and readiness',action:'Confirm identity only when feasible without delaying care; check that maternal-resuscitation resources and personnel are being mobilized.',why:'Pregnancy changes anatomy and physiology, including potential compression of major vessels by the enlarged uterus. This diagram is illustrative, not patient-specific.',visual:'MATERNAL CONSIDERATIONS'},
 {title:'Position yourself for CPR',action:'Move alongside the patient and prepare to perform the next indicated resuscitation actions on a firm surface.',why:'Correct positioning supports effective chest compressions. For a pregnant patient, trained team members should plan pregnancy-specific modifications as indicated by the clinical protocol.',visual:'RESCUER POSITIONING'}
];
let idx=0,visible=true,tracked=false;const $=id=>document.getElementById(id);
function render(){
 const st=steps[idx];
 $('step').textContent=`${idx+1}/6 — ${st.title}`;
 $('detail').innerHTML='';
 for(const [label,value] of [['STUDENT ACTION',st.action],['WHY IT MATTERS',st.why]]){
   const h=document.createElement('div');h.className='kicker';h.textContent=label;
   const t=document.createElement('div');t.textContent=value;
   $('detail').append(h,t);
 }
 $('progress').style.width=((idx+1)/6*100)+'%';
 $('prev').disabled=idx===0;$('next').disabled=idx===5;
 $('anatomy').textContent=visible?'Hide 3D':'Show 3D';
 for(let i=0;i<6;i++){const v=$('visual-'+i);if(v)v.setAttribute('visible',visible && i===idx)}
 $('visual-caption').textContent=st.visual;
 $('step-counter').textContent=`SCENE ${String(idx+1).padStart(2,'0')} / 06`;
 $('detail').scrollTop=0;
}
$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};
$('next').onclick=()=>{idx=Math.min(5,idx+1);render()};
$('anatomy').onclick=()=>{visible=!visible;render()};render();
// Keep the simplified fallback visible unless the actual GLB finishes loading.
const mannequin=$('training-mannequin');
if(mannequin){
 mannequin.addEventListener('model-loaded',()=>{
  mannequin.setAttribute('visible',true);
  $('mannequin-fallback').setAttribute('visible',false);
  $('asset-status').textContent='Training mannequin: 3D asset loaded';
 });
 mannequin.addEventListener('model-error',()=>{
  $('asset-status').textContent='Training mannequin unavailable — simplified illustration shown';
 });
}
function syncViewport(){document.documentElement.style.setProperty('--screen-h',window.innerHeight+'px')}syncViewport();window.addEventListener('resize',syncViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncViewport);
const scene=document.querySelector('a-scene');
scene.addEventListener('loaded',()=>{$('status').textContent='3D scene loaded — starting camera…'});
scene.addEventListener('arReady',()=>{$('status').textContent='Camera ready — scan Skill 01 marker'});
scene.addEventListener('arError',()=>{$('status').textContent='AR ERROR — camera, network, or tracking issue'});
$('target').addEventListener('targetFound',()=>{tracked=true;$('notice').textContent='Marker detected — 3D schematic visible';$('status').textContent='Marker detected — anatomy schematic active';});
$('target').addEventListener('targetLost',()=>{tracked=false;$('notice').textContent='Point camera at Skill 01 marker';$('status').textContent='Marker not in view';});
window.addEventListener('error',e=>{$('status').textContent='PAGE ERROR: '+String(e.message).slice(0,90)});
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pregnancy CPR | AR Practice</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:Arial,sans-serif}
#banner{position:fixed;top:0;left:0;right:0;background:rgba(11,29,45,.9);color:white;padding:12px;text-align:center;z-index:9;font-size:14px}
#help{position:fixed;bottom:12px;left:10px;right:10px;background:rgba(255,255,255,.93);padding:10px;border-radius:8px;text-align:center;z-index:9;font-size:13px}
</style>
</head>
<body>
<div id="banner">Pregnancy CPR — AR Training Prototype</div>
<div id="help">Allow camera access and point your phone at the printed HIRO marker. This is a visual technology test, not a clinical CPR demonstration.</div>
<a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; precision: medium" arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
<a-marker preset="hiro" emitevents="true">
<!-- Simple placeholder to verify marker tracking. Replace with validated medical GLB later. -->
<a-entity id="placeholder" position="0 0.35 0">
<a-cylinder position="0 0.12 0" radius="0.26" height="0.5" color="#E8BCA5"></a-cylinder>
<a-sphere position="0 0.49 0" radius="0.19" color="#E8BCA5"></a-sphere>
<a-sphere position="0 0.03 0.24" radius="0.22" color="#DCA88F"></a-sphere>
<a-text value="AR tracking works" align="center" position="0 0.85 0" rotation="-90 0 0" width="2.5" color="#142E44"></a-text>
</a-entity>
<!-- Once you have an approved model, place mannequin.glb next to index.html and replace the placeholder entity above with: <a-entity gltf-model="url(mannequin.glb)" position="0 0 0" scale="0.5 0.5 0.5"></a-entity> -->
</a-marker>
<a-entity camera></a-entity>
</a-scene>
</body></html>

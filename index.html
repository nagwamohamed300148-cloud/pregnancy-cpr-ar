<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pregnancy CPR | Skill 01 AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font:14px Arial,sans-serif}
.panel{position:fixed;z-index:20;left:10px;right:10px;background:rgba(5,24,44,.87);border:1px solid #39c9e9;border-radius:12px;padding:10px;box-shadow:0 3px 12px #0005;overflow-wrap:anywhere}
header{top:calc(8px + env(safe-area-inset-top));max-height:22vh;overflow:auto}
header strong{display:block;font-size:clamp(12px,3.3vw,16px);line-height:1.3}
header small{display:block;margin-top:4px;color:#b5eafa;font-size:12px}
#status{font-size:11px;color:#9fe5f5;margin-top:5px}
.bottom{bottom:calc(8px + env(safe-area-inset-bottom));max-height:30vh;overflow:auto}
#step{font-weight:bold;font-size:14px;margin-bottom:5px}
#detail{font-size:12px;line-height:1.35;color:#d5e9f3;max-height:12vh;overflow:auto}
.buttons{display:flex;gap:6px;margin-top:8px}
button{flex:1;min-width:0;padding:10px 2px;border:0;border-radius:8px;background:#14b9dc;color:#041725;font-size:12px;font-weight:bold}
button:disabled{opacity:.4}button.secondary{background:#d6eaf2}
#notice{position:fixed;top:25%;left:15px;right:15px;text-align:center;color:#fff;text-shadow:0 2px 5px #000;z-index:15;pointer-events:none;font-size:12px}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;background:transparent!important}
a-scene canvas{background:transparent!important}
</style>
<script>
AFRAME.registerComponent('pulse-heart',{
 init:function(){this.baseScale=this.el.object3D.scale.clone()},
 tick:function(t){if(!this.baseScale)return;const s=1+.07*Math.sin(t/240);this.el.object3D.scale.copy(this.baseScale).multiplyScalar(s)}
});
</script>
</head>
<body>
<header class="panel"><strong>PREGNANCY CPR · AR CLINICAL TRAINING</strong><small>Skill 01 — Pre-Procedure Activities</small><div id="status">Loading AR…</div></header>
<div id="notice">Point camera at the exact Skill 01 image used to create targets.mind</div>
<div class="panel bottom"><div id="step"></div><div id="detail"></div><div class="buttons"><button id="prev" class="secondary">Previous</button><button id="next">Next</button><button id="anatomy" class="secondary">Hide anatomy</button></div></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true; antialias: true; alpha: true" background="color: #000000; transparent: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0">
<!-- Educational 3D schematic anchored to the existing Skill 01 image target. -->
<a-entity id="model" position="0 0 0.11" scale="0.48 0.48 0.48">
  <a-sphere position="0 -0.04 0" scale="0.43 0.67 0.19" material="color:#f1c6b5;transparent:true;opacity:0.20;side:double;depthWrite:false"></a-sphere>
  <a-sphere position="0 -0.37 0.02" scale="0.42 0.31 0.25" material="color:#f1c6b5;transparent:true;opacity:0.18;side:double;depthWrite:false"></a-sphere>
  <a-entity id="organs">
    <a-cylinder position="0 0.35 0.13" radius="0.025" height="0.18" color="#e4d8bd"></a-cylinder>
    <a-sphere position="-0.16 0.15 0.17" scale="0.15 0.25 0.10" material="color:#f4a4b9;roughness:0.65"></a-sphere>
    <a-sphere position="0.16 0.15 0.17" scale="0.15 0.25 0.10" material="color:#f4a4b9;roughness:0.65"></a-sphere>
    <a-sphere id="heart" pulse-heart position="0.025 0.13 0.29" scale="0.085 0.115 0.08" color="#dc3056"></a-sphere>
    <a-sphere position="0 -0.36 0.20" scale="0.30 0.24 0.17" material="color:#a54c75;roughness:0.55"></a-sphere>
    <a-sphere position="0.02 -0.38 0.35" scale="0.105 0.13 0.065" color="#f4c4a0"></a-sphere>
    <a-torus position="0 0.15 0.24" radius="0.32" radius-tubular="0.006" color="#9ce9ff" opacity="0.65"></a-torus>
  </a-entity>
  <a-text value="LUNGS" position="-0.34 0.43 0.32" width="0.85" color="#c8f2ff" align="center" side="double"></a-text>
  <a-text value="HEART" position="0.32 0.28 0.38" width="0.75" color="#ffe1e7" align="center" side="double"></a-text>
  <a-text value="UTERUS" position="-0.33 -0.54 0.33" width="0.85" color="#ffd4e9" align="center" side="double"></a-text>
  <a-text value="SCHEMATIC" position="0 -0.75 0.25" width="1.5" align="center" color="#ffffff" side="double"></a-text>
</a-entity>
</a-entity>
</a-scene>
<script>
const steps=[
['Ensure scene safety','Check for environmental hazards before approaching the patient.'],
['Wear PPE','Put on appropriate personal protective equipment and barriers.'],
['Assess responsiveness','Tap the patient’s shoulders and ask loudly: “Are you okay?”'],
['Call for immediate help','Recognize unresponsiveness and summon nearby assistance promptly.'],
['Verify identity and readiness','Verify patient identity when feasible and assess maternal resuscitation readiness without delaying emergency response.'],
['Position yourself for CPR','Move alongside the patient, ready to begin the next indicated resuscitation actions.']
];
let idx=0,visible=true,tracked=false;const $=id=>document.getElementById(id);
function render(){$('step').textContent=`${idx+1}/6 — ${steps[idx][0]}`;$('detail').textContent=steps[idx][1];$('prev').disabled=idx===0;$('next').disabled=idx===5;$('anatomy').textContent=visible?'Hide anatomy':'Show anatomy'}
$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('next').onclick=()=>{idx=Math.min(5,idx+1);render()};$('anatomy').onclick=()=>{visible=!visible;$('organs').setAttribute('visible',visible);render()};render();
const scene=document.querySelector('a-scene');
scene.addEventListener('loaded',()=>{$('status').textContent='3D scene loaded — starting camera…'});
scene.addEventListener('arReady',()=>{$('status').textContent='Camera ready — scan Skill 01 marker'});
scene.addEventListener('arError',()=>{$('status').textContent='AR ERROR — camera, network, or tracking issue'});
$('target').addEventListener('targetFound',()=>{tracked=true;$('notice').textContent='Marker detected — 3D schematic visible';$('status').textContent='Marker detected — anatomy schematic active';});
$('target').addEventListener('targetLost',()=>{tracked=false;$('notice').textContent='Point camera at Skill 01 marker';$('status').textContent='Marker not in view';});
window.addEventListener('error',e=>{$('status').textContent='PAGE ERROR: '+String(e.message).slice(0,90)});
</script>
</body></html>
